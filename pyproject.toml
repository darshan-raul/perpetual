[project]
name = "perpetual"
version = "0.0.0"
description = "AWS disaster-recovery readiness: evidence-based dependency graph, Region-failure simulation, whole-stack RTO/RPO and DR plans"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Darshan Raul" }]
dependencies = [
    "alembic>=1.14",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.2",
    "rich>=13.9",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
]

[project.scripts]
perpetual = "perpetual.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package source lives in apps/api/perpetual (IMPL_PLAN D5); the root
# project builds it so `uv tool install .` works from the repo root.
[tool.hatch.build.targets.wheel]
packages = ["apps/api/perpetual"]

[tool.hatch.build.targets.sdist]
include = ["apps/api/perpetual", "README.md"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api"]
extend-exclude = ["apps/web", "site", "packages", "examples", "generated", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL", "TID"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["perpetual"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps/api/perpetual", "apps/api/tests"]
mypy_path = "apps/api"
explicit_package_bases = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib", "-m", "not contract"]
markers = [
    "contract: real-AWS contract suite; needs sandbox credentials, never runs by default",
]
xfail_strict = true

# Layer boundaries (IMPL_PLAN §3.3, spec §102). Run with `lint-imports` (part of `mise run lint`).
[tool.importlinter]
root_package = "perpetual"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "models, ids and config import nothing else from perpetual"
type = "forbidden"
source_modules = ["perpetual.models", "perpetual.ids", "perpetual.config"]
forbidden_modules = [
    "perpetual.fixtures", "perpetual.persistence", "perpetual.collectors", "perpetual.importers",
    "perpetual.normalization", "perpetual.evidence", "perpetual.graph", "perpetual.stacks",
    "perpetual.rules", "perpetual.simulator", "perpetual.recovery", "perpetual.optimizer",
    "perpetual.costing", "perpetual.iac", "perpetual.llm", "perpetual.knowledge",
    "perpetual.runbooks", "perpetual.api", "perpetual.cli",
]

[[tool.importlinter.contracts]]
name = "domain models never import FastAPI or SQLAlchemy"
type = "forbidden"
source_modules = ["perpetual.models"]
forbidden_modules = ["fastapi", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "collectors only collect (rule 2)"
type = "forbidden"
source_modules = ["perpetual.collectors"]
forbidden_modules = ["perpetual.rules", "perpetual.simulator", "perpetual.recovery", "perpetual.optimizer"]

[[tool.importlinter.contracts]]
name = "normalization never imports api or cli (rule 3)"
type = "forbidden"
source_modules = ["perpetual.normalization"]
forbidden_modules = ["perpetual.api", "perpetual.cli"]

[[tool.importlinter.contracts]]
name = "rules never import collectors (rule 4)"
type = "forbidden"
source_modules = ["perpetual.rules"]
forbidden_modules = ["perpetual.collectors"]

[[tool.importlinter.contracts]]
name = "simulator never rediscovers AWS (rule 5)"
type = "forbidden"
source_modules = ["perpetual.simulator"]
forbidden_modules = ["perpetual.collectors", "perpetual.importers"]

[[tool.importlinter.contracts]]
name = "nothing below api and cli imports them (rule 1)"
type = "forbidden"
source_modules = [
    "perpetual.models", "perpetual.ids", "perpetual.config", "perpetual.fixtures",
    "perpetual.persistence", "perpetual.collectors", "perpetual.importers",
    "perpetual.normalization", "perpetual.evidence", "perpetual.graph", "perpetual.stacks",
    "perpetual.rules", "perpetual.simulator", "perpetual.recovery", "perpetual.optimizer",
    "perpetual.costing", "perpetual.iac", "perpetual.llm", "perpetual.knowledge",
    "perpetual.runbooks",
]
forbidden_modules = ["perpetual.api", "perpetual.cli"]

[[tool.importlinter.contracts]]
name = "the engine never calls an agent (rule 11)"
type = "forbidden"
source_modules = [
    "perpetual.models", "perpetual.ids", "perpetual.config", "perpetual.fixtures",
    "perpetual.persistence", "perpetual.collectors", "perpetual.importers",
    "perpetual.normalization", "perpetual.evidence", "perpetual.graph", "perpetual.stacks",
    "perpetual.rules", "perpetual.simulator", "perpetual.recovery", "perpetual.optimizer",
    "perpetual.costing", "perpetual.iac", "perpetual.runbooks",
]
forbidden_modules = ["perpetual.llm", "perpetual.knowledge"]

[[tool.importlinter.contracts]]
name = "only llm imports LangChain or LangGraph"
type = "forbidden"
source_modules = [
    "perpetual.models", "perpetual.ids", "perpetual.config", "perpetual.fixtures",
    "perpetual.persistence", "perpetual.collectors", "perpetual.importers",
    "perpetual.normalization", "perpetual.evidence", "perpetual.graph", "perpetual.stacks",
    "perpetual.rules", "perpetual.simulator", "perpetual.recovery", "perpetual.optimizer",
    "perpetual.costing", "perpetual.iac", "perpetual.knowledge", "perpetual.runbooks",
    "perpetual.api", "perpetual.cli",
]
forbidden_modules = ["langchain", "langchain_core", "langgraph"]
allow_indirect_imports = true
