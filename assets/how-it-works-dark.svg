<title id="how-it-works-dark-title">How Perpetual works</title>
<desc id="how-it-works-dark-desc">Perpetual discovers infrastructure, computes an evidence-backed dependency graph that the user reviews, defines the stack, resolves DR paths, simulates a Region failure, builds one recovery plan for the whole stack, compares architectures and generates DR Terraform and runbooks.</desc>
