name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, contracts, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml, cached between runs.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.1

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      - name: Install Python dependencies
        run: mise exec -- uv sync --all-groups --locked

      # Same command as local: ruff, import-linter contracts, mypy --strict, pytest.
      - name: Check
        run: mise run check
